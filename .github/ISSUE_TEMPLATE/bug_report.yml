name: Bug report
description: Report a reproducible problem in Codex Usage Tray.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste tokens, cookies, auth.json, or private account data.
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows and Codex version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
